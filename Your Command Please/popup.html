<!DOCTYPE html>
<!-- Material Next: independent design language built on M3; not an official Google design. -->
<html lang="en" data-expressiveness="expressive">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Command Please</title>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="styles.css">
    <script src="shared.js"></script>
    <script src="icons.js"></script>
</head>
<body>
    <div id="main-container">
        <div class="search-bar">
            <span class="search-lead" id="searchLead" aria-hidden="true"></span>
            <div class="input-wrapper">
                <div id="autofill"></div>
                <input type="text" id="commandInput" placeholder="Type a command" aria-label="Command" autocomplete="off" spellcheck="false">
            </div>
            <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings"></button>
        </div>
        <div id="suggestions" role="listbox"></div>
        <div class="footer-hint">
            <span><kbd>↵</kbd> run</span>
            <span><kbd>⇥</kbd> complete</span>
            <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
            <span><kbd>esc</kbd> close</span>
        </div>
    </div>

    <!-- Inline argument prompt (replaces window.prompt) -->
    <div class="hidden" id="prompt-container">
        <div class="panel-head">
            <button class="icon-btn back" id="promptBack" title="Back" aria-label="Back"></button>
            <h2 id="promptTitle">Enter value</h2>
        </div>
        <label class="field"><span>Search term</span>
            <input type="text" id="promptInput" placeholder="Type here" autocomplete="off">
        </label>
        <div class="btn-row">
            <button class="btn text" id="promptCancel">Cancel</button>
            <button class="btn filled" id="promptOk">Search</button>
        </div>
    </div>

    <!-- Add / edit command -->
    <div class="hidden" id="edit-command-container">
        <div class="panel-head">
            <button class="icon-btn back" id="editBack" title="Back" aria-label="Back"></button>
            <h2 id="editTitle">New command</h2>
        </div>
        <label class="field"><span>Command name</span>
            <input type="text" id="editName" placeholder="e.g. new linear issue" autocomplete="off">
        </label>
        <label class="field"><span>URL</span>
            <input type="text" id="editUrl" placeholder="https://… or chrome://…" autocomplete="off">
        </label>
        <div class="btn-row">
            <button class="btn text" id="editCancel">Cancel</button>
            <button class="btn filled" id="editSave">Save</button>
        </div>
    </div>

    <!-- Add search command -->
    <div class="hidden" id="search-command-container">
        <div class="panel-head">
            <button class="icon-btn back" id="searchBack" title="Back" aria-label="Back"></button>
            <h2>New search command</h2>
        </div>
        <p class="guidance">On the target site, search for <b>abc xyz pqr</b>, then paste the address-bar URL below. It becomes a reusable search.</p>
        <label class="field"><span>Command name</span>
            <input type="text" id="searchName" placeholder="e.g. search github" autocomplete="off">
        </label>
        <label class="field"><span>Search URL</span>
            <input type="text" id="searchUrl" placeholder="Paste the URL here" autocomplete="off">
        </label>
        <div class="btn-row">
            <button class="btn text" id="searchCancel">Cancel</button>
            <button class="btn filled" id="searchSave">Save</button>
        </div>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>

    <script src="popup.js"></script>
</body>
</html>
